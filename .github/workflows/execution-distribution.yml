name: SABLE execution distribution

on:
  push:
    paths:
      - 'execution_distribution_v12.py'
      - 'schemas/execution_record_v12.schema.json'
      - 'results/*evidence.json'
      - 'results/*permission.json'
      - '.github/workflows/execution-distribution.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover evidence-backed records
        run: |
          python - <<'PY'
          from pathlib import Path
          evidence=sorted(Path('results').glob('*evidence.json'))
          pairs=[]
          for e in evidence:
              p=e.with_name(e.name.replace('_evidence.json','_permission.json'))
              if p.exists():
                  pairs.append((str(e),str(p)))
          if len(pairs)<2:
              raise SystemExit(f'Need >=2 evidence/permission pairs, found {len(pairs)}')
          Path('/tmp/sable-records.txt').write_text('\n'.join(f'{e}\t{p}' for e,p in pairs)+'\n')
          print(f'Discovered {len(pairs)} evidence-backed records')
          for e,p in pairs: print(e,p)
          PY
      - name: Aggregate verified execution distribution
        run: |
          args=()
          while IFS=$'\t' read -r evidence permission; do
            args+=(--record "$evidence" "$permission")
          done < /tmp/sable-records.txt
          python execution_distribution_v12.py "${args[@]}" --out results/execution_distribution_v12.json
      - name: Enforce no false statistical certainty
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/execution_distribution_v12.json').read_text())
          assert r['observation_count'] >= 2
          assert r['sample_quality'] in {'observations_only','rate_estimate'}
          assert r['all_replay_matches'] is True
          print(json.dumps({
              'observation_count': r['observation_count'],
              'sample_quality': r['sample_quality'],
              'counts': r['counts'],
              'verified_task_success_rate': r['verified_task_success_rate'],
              'runtime_breakdown': r['runtime_breakdown'],
          }, indent=2))
          PY
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: sable-execution-distribution-v12
          path: results/execution_distribution_v12.json
      - name: Publish distribution snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/execution_distribution_v12.json
          if git diff --cached --quiet; then
            echo 'No distribution changes.'
            exit 0
          fi
          git commit -m 'evidence: publish execution distribution snapshot'
          git push
