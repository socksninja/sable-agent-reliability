name: SABLE Second CrewAI Trace

on:
  push:
    branches: [sable/crewai-second-runtime-v01]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  crewai-trace:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install CrewAI runtime
        run: python -m pip install -r integrations/crewai/requirements.txt

      - name: Run live CrewAI application
        run: python3 integrations/crewai/run_real_trace_v09.py

      - name: Validate v0.9 submission
        run: |
          python3 trace_submit_v09.py \
            --input results/third_party_crewai_submission_v09.jsonl \
            --output results/third_party_crewai_sable_v05.jsonl

      - name: Evaluate normalized trace with SABLE
        run: |
          python3 sable_v05.py \
            --tasks integrations/crewai/task.json \
            --results results/third_party_crewai_sable_v05.jsonl \
            --report results/third_party_crewai_report.json \
            --replay

      - name: Enforce replay integrity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('results/third_party_crewai_report.json').read_text(encoding='utf-8'))
          rate = report.get('replay_match_rate')
          if rate != 1.0:
              raise SystemExit(f'replay_integrity_failed: replay_match_rate={rate!r}')
          print('REPLAY_INTEGRITY=1.0')
          PY

      - name: Enforce task success
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('results/third_party_crewai_report.json').read_text(encoding='utf-8'))
          if report.get('pass_rate') != 1.0:
              raise SystemExit(f'task_success_failed: pass_rate={report.get("pass_rate")!r}')
          print('TASK_SUCCESS=1.0')
          PY

      - name: Upload CrewAI evidence
        uses: actions/upload-artifact@v7
        with:
          name: sable-crewai-trace-${{ github.run_id }}
          path: |
            results/third_party_crewai_raw_v09.jsonl
            results/third_party_crewai_submission_v09.jsonl
            results/third_party_crewai_sable_v05.jsonl
            results/third_party_crewai_report.json
          if-no-files-found: error
