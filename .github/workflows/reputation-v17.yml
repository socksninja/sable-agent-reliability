name: SABLE reputation v1.7

on:
  push:
    paths:
      - 'reputation_v17.py'
      - 'schemas/reputation_v17.schema.json'
      - 'tests/test_reputation_v17.py'
      - 'results/*evidence.json'
      - 'results/*permission.json'
      - '.github/workflows/reputation-v17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reputation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Self-test
        run: python -m pytest -q tests/test_reputation_v17.py
      - name: Build reputation from verified evidence
        run: |
          mapfile -t E < <(find results -maxdepth 1 -name '*_evidence.json' | sort)
          mapfile -t P < <(find results -maxdepth 1 -name '*_permission.json' | sort)
          test "${#E[@]}" -gt 0
          test "${#E[@]}" -eq "${#P[@]}"
          python reputation_v17.py --evidence "${E[@]}" --permission "${P[@]}" --out results/reputation_v17.json
      - name: Validate reputation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/reputation_v17.json').read_text())
          assert r['schema_version']=='sable.reputation.v1.7'
          assert r['scoring_contract']['predictive_claim'] is False
          assert all(0 <= v['trust_score_observed'] <= 100 for v in r['profiles'].values())
          assert len(r['reputation_hash']) == 64
          print(json.dumps({
            'observations': r['observation_count'],
            'profiles': len(r['profiles']),
            'states': {k:v['reputation_state'] for k,v in r['profiles'].items()}
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sable-reputation-v17
          path: results/reputation_v17.json
