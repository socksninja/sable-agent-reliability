name: Public Receipt Verifier Self-Test

on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_public_receipt.py'
      - '.github/workflows/verify-public-receipt-selftest.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical RSTA-037 receipt with generic verifier
        run: >-
          python3 scripts/verify_public_receipt.py
          https://raw.githubusercontent.com/socksninja/-/main/rsta-evidence/rsta037/34630865469-rsta037-execution-receipt.json
