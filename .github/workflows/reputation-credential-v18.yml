name: SABLE reputation credential v1.8

on:
  push:
    paths:
      - 'reputation_credential_v18.py'
      - 'schemas/reputation_credential_v18.schema.json'
      - 'tests/test_reputation_credential_v18.py'
      - 'results/reputation_v17.json'
      - '.github/workflows/reputation-credential-v18.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Self-test
        run: python -m pytest -q tests/test_reputation_credential_v18.py
      - name: Require reputation input
        run: test -f results/reputation_v17.json
      - name: Build portable credential
        run: python reputation_credential_v18.py --input results/reputation_v17.json --out results/reputation_credential_v18.json
      - name: Validate credential contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/reputation_credential_v18.json').read_text())
          assert r['schema_version']=='sable.reputation_credential.v1.8'
          assert len(r['credential_hash'])==64
          assert r['verification_contract']['source_hash_required'] is True
          assert r['verification_contract']['score_is_observed_history'] is True
          print(json.dumps({'credentials':len(r['credentials']), 'observations':r['observation_count'], 'credential_hash':r['credential_hash']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sable-reputation-credential-v18
          path: results/reputation_credential_v18.json
