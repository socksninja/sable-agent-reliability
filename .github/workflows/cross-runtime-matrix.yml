name: SABLE cross-runtime evidence matrix

on:
  push:
    paths:
      - 'cross_runtime_matrix_v10.py'
      - 'results/third_party_langgraph_evidence.json'
      - 'results/third_party_langgraph_permission.json'
      - 'results/third_party_crewai_evidence.json'
      - 'results/third_party_crewai_permission.json'
      - '.github/workflows/cross-runtime-matrix.yml'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate cross-runtime invariants
        run: |
          python cross_runtime_matrix_v10.py \
            --langgraph-evidence results/third_party_langgraph_evidence.json \
            --langgraph-permission results/third_party_langgraph_permission.json \
            --crewai-evidence results/third_party_crewai_evidence.json \
            --crewai-permission results/third_party_crewai_permission.json \
            --out results/cross_runtime_matrix_v10.json
      - name: Upload matrix result
        uses: actions/upload-artifact@v4
        with:
          name: sable-cross-runtime-matrix-v10
          path: results/cross_runtime_matrix_v10.json
