name: SABLE real-agent 140-task campaign v0.1

on:
  workflow_dispatch:
    inputs:
      base_url:
        required: true
        default: https://api.openai.com/v1
        description: OpenAI-compatible provider base URL
      model:
        required: true
        description: Model identifier
      repeats:
        required: true
        default: '1'
        description: Repetitions over the reproducible 140-task benchmark
      max_turns:
        required: true
        default: '8'
      thinking:
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - enabled
  push:
    paths:
      - '.github/campaign_launch.json'

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize reproducible 140-task benchmark
        run: python tasks/generate_adversarial.py
      - name: Validate benchmark contract
        run: python scripts/validate_adversarial_coverage_v01.py
      - name: Resolve campaign configuration
        id: config
        env:
          DISPATCH_BASE_URL: ${{ inputs.base_url }}
          DISPATCH_MODEL: ${{ inputs.model }}
          DISPATCH_REPEATS: ${{ inputs.repeats }}
          DISPATCH_MAX_TURNS: ${{ inputs.max_turns }}
          DISPATCH_THINKING: ${{ inputs.thinking }}
          REPOSITORY_MODEL: ${{ vars.SABLE_MODEL }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          p = Path('.github/campaign_launch.json')
          cfg = json.loads(p.read_text()) if p.exists() else {}

          def pick(env_name, key, default=None):
              value = os.environ.get(env_name, '')
              return value if value else cfg.get(key, default)

          model = pick('DISPATCH_MODEL', 'model')
          if not model and cfg.get('model_source') == 'repository_variable:SABLE_MODEL':
              model = os.environ.get('REPOSITORY_MODEL', '')

          print(f"enabled={'true' if cfg.get('enabled', True) else 'false'}")
          print(f"base_url={pick('DISPATCH_BASE_URL','base_url','https://api.openai.com/v1')}")
          print(f"model={model}")
          print(f"repeats={pick('DISPATCH_REPEATS','repeats',1)}")
          print(f"max_turns={pick('DISPATCH_MAX_TURNS','max_turns',8)}")
          print(f"thinking={pick('DISPATCH_THINKING','thinking','disabled')}")
          PY
      - name: Write launch diagnostics
        if: always()
        env:
          ENABLED: ${{ steps.config.outputs.enabled }}
          BASE_URL: ${{ steps.config.outputs.base_url }}
          MODEL: ${{ steps.config.outputs.model }}
          REPEATS: ${{ steps.config.outputs.repeats }}
          MAX_TURNS: ${{ steps.config.outputs.max_turns }}
          THINKING: ${{ steps.config.outputs.thinking }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p results
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'schema_version': 'sable.campaign_launch_diagnostics.v0.1',
              'workflow': os.getenv('WORKFLOW'),
              'run_id': int(os.getenv('RUN_ID', '0')),
              'run_attempt': int(os.getenv('RUN_ATTEMPT', '0')),
              'head_sha': os.getenv('SHA'),
              'event': os.getenv('EVENT'),
              'enabled': os.getenv('ENABLED') == 'true',
              'base_url': os.getenv('BASE_URL'),
              'model': os.getenv('MODEL'),
              'repeats': int(os.getenv('REPEATS') or 0),
              'max_turns': int(os.getenv('MAX_TURNS') or 0),
              'thinking': os.getenv('THINKING'),
              'api_key_present': bool(os.getenv('SABLE_API_KEY')),
          }
          Path('results/campaign_launch_diagnostics.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Require resolved model
        if: steps.config.outputs.enabled == 'true'
        env:
          MODEL: ${{ steps.config.outputs.model }}
        run: test -n "$MODEL"
      - name: Run 140-task campaign
        if: steps.config.outputs.enabled == 'true'
        env:
          SABLE_API_KEY: ${{ secrets.SABLE_API_KEY }}
        run: |
          mkdir -p results
          set +e
          python campaign_orchestrator_v14.py \
            --api-key "$SABLE_API_KEY" \
            --base-url "${{ steps.config.outputs.base_url }}" \
            --model "${{ steps.config.outputs.model }}" \
            --repeats "${{ steps.config.outputs.repeats }}" \
            --max-turns "${{ steps.config.outputs.max_turns }}" \
            --thinking "${{ steps.config.outputs.thinking }}" \
            --tasks tasks/tasks_v0_4_140.json \
            --out results/external_model_campaign_v14.json \
            2>&1 | tee results/campaign_launcher.log
          rc=${PIPESTATUS[0]}
          python - <<PY
          import json
          from pathlib import Path
          p = Path('results/campaign_launch_diagnostics.json')
          data = json.loads(p.read_text()) if p.exists() else {}
          data['campaign_exit_code'] = $rc
          data['campaign_status'] = 'success' if $rc == 0 else 'failed'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          exit "$rc"
      - name: Build observed failure taxonomy
        if: steps.config.outputs.enabled == 'true' && success()
        run: |
          mapfile -t E < <(find results/campaigns -name '*_evidence.jsonl' | sort)
          mapfile -t P < <(find results/campaigns -name '*_permission.jsonl' | sort)
          test "${#E[@]}" -gt 0
          test "${#E[@]}" -eq "${#P[@]}"
          python failure_taxonomy_v14.py \
            --evidence "${E[@]}" \
            --permission "${P[@]}" \
            --out results/failure_taxonomy_v14.json
      - name: Build attack-family heatmap
        if: steps.config.outputs.enabled == 'true' && success()
        run: |
          python scripts/build_campaign_family_heatmap_v01.py \
            --campaign results/external_model_campaign_v14.json \
            --out results/campaign_family_heatmap_v01.json
      - name: Enforce evidence integrity
        if: steps.config.outputs.enabled == 'true' && success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          campaign = json.loads(Path('results/external_model_campaign_v14.json').read_text())
          heatmap = json.loads(Path('results/campaign_family_heatmap_v01.json').read_text())
          assert campaign['observation_count'] == 140 * campaign['repetition_count']
          assert campaign['all_replay_matches'] is True
          assert heatmap['observation_count'] == campaign['observation_count']
          assert len(heatmap['families']) >= 10
          print(f"OBSERVATIONS={campaign['observation_count']}")
          print(f"FAMILY_ROWS={len(heatmap['families'])}")
          print("EVIDENCE_INTEGRITY=PASS")
          PY
      - name: Upload complete campaign evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sable-real-agent-140-campaign-v01
          if-no-files-found: warn
          path: |
            results/campaign_launch_diagnostics.json
            results/campaign_launcher.log
            results/external_model_campaign_v14.json
            results/failure_taxonomy_v14.json
            results/campaign_family_heatmap_v01.json
            results/campaign_family_heatmap_v01.md
            results/campaigns/**
