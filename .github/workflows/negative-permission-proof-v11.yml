name: SABLE negative permission proof v1.1

on:
  push:
    paths:
      - '.github/workflows/negative-permission-proof-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  negative-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install third-party runtime
        run: python -m pip install --upgrade pip 'crewai==1.15.20'
      - name: Capture live failing CrewAI runtime trace
        run: python integrations/crewai/run_negative_control_v09.py
      - name: Validate and normalize
        run: |
          python trace_submit_v09.py \
            --input results/third_party_crewai_negative_submission_v09.jsonl \
            --output results/third_party_crewai_negative_sable_v05.jsonl
      - name: Evaluate failure from environment
        run: |
          python evaluator.py \
            --tasks integrations/crewai/negative_task.json \
            --traces results/third_party_crewai_negative_sable_v05.jsonl \
            --out results/third_party_crewai_negative_evaluation.json
      - name: Generate replayable evidence
        run: |
          python evidence_v06.py \
            --tasks integrations/crewai/negative_task.json \
            --results results/third_party_crewai_negative_sable_v05.jsonl \
            --out results/third_party_crewai_negative_evidence.json
      - name: Decide DENY
        run: |
          python permission_v01.py \
            --input results/third_party_crewai_negative_sable_v05.jsonl \
            --output results/third_party_crewai_negative_permission.json
      - name: Enforce symmetric safety semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          normalized = json.loads(Path('results/third_party_crewai_negative_sable_v05.jsonl').read_text())
          evaluation = json.loads(Path('results/third_party_crewai_negative_evaluation.json').read_text())
          evidence = json.loads(Path('results/third_party_crewai_negative_evidence.json').read_text())
          permission = json.loads(Path('results/third_party_crewai_negative_permission.json').read_text())
          assert normalized['steps'][0]['observed_result']['ok'] is False
          assert evaluation['summary']['task_success_rate'] == 0.0
          assert evidence['replay']['task_success'] is False
          assert evidence['replay']['replay_match'] is True
          assert permission['verified'] is False
          assert permission['decision'] == 'DENY'
          assert permission['reasons']
          print(json.dumps({
              'trace': 'CAPTURED',
              'verification': 'FAIL_AS_EXPECTED',
              'replay': 'MATCH',
              'permission': 'DENY',
              'reasons': permission['reasons'],
          }, indent=2))
          PY
      - name: Upload negative proof
        uses: actions/upload-artifact@v4
        with:
          name: sable-negative-permission-proof-v11
          path: results/third_party_crewai_negative_*.json*
          if-no-files-found: error
      - name: Publish negative proof
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/third_party_crewai_negative_*.json results/third_party_crewai_negative_*.jsonl
          if git diff --cached --quiet; then
            echo 'No new negative evidence files to publish.'
            exit 0
          fi
          git commit -m 'evidence: publish CrewAI DENY proof v1.1'
          git push
