name: SABLE Reliability Matrix

on:
  push:
    paths:
      - 'records/**'
      - 'scripts/validate_reliability_records.py'
      - 'scripts/build_reliability_matrix.py'
      - 'scripts/build_failure_taxonomy.py'
      - '.github/workflows/build-reliability-matrix.yml'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate public Reliability Records
        run: python scripts/validate_reliability_records.py
      - name: Build deterministic Reliability Matrix
        run: python scripts/build_reliability_matrix.py
      - name: Build deterministic Failure Taxonomy
        run: python scripts/build_failure_taxonomy.py
      - name: Check generated profile consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          matrix = json.loads(Path('records/RELIABILITY_MATRIX_V0.1.json').read_text())
          assert matrix['record_count'] == len(matrix['records'])
          for row in matrix['records']:
              assert 0 <= row['failure_rate'] <= 1
              assert row['failure_count'] == sum(row['failure_signature'].values())
              assert abs(row['failure_rate'] - row['failure_count'] / row['n']) < 1e-9
          print(f"PROFILE_ROWS={len(matrix['records'])}")
          print("PROFILE_CONSISTENCY=PASS")
          PY
      - name: Upload Reliability Matrix and Failure Taxonomy
        uses: actions/upload-artifact@v4
        with:
          name: sable-reliability-matrix-and-taxonomy-v01
          path: |
            records/RELIABILITY_MATRIX_V0.1.json
            docs/RELIABILITY_MATRIX_V0.1.md
            records/FAILURE_TAXONOMY_V0.1.json
            docs/FAILURE_TAXONOMY_V0.1.md
