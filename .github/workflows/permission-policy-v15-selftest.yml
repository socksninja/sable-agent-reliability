name: SABLE permission policy v1.5 self-test

on:
  push:
    paths:
      - 'permission_policy_v15.py'
      - 'tests/test_permission_policy_v15.py'
      - '.github/workflows/permission-policy-v15-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run policy self-test
        run: python -m unittest discover -s tests -p 'test_permission_policy_v15.py'
