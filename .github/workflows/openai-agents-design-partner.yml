name: SABLE OpenAI Agents design-partner execution

on:
  workflow_dispatch:

jobs:
  real-execution:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK
        run: python -m pip install --disable-pip-version-check 'openai-agents>=0.2,<1' requests
      - name: Run exactly one real tool execution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SABLE_EXTERNAL_ISSUE: "63"
        run: python integrations/openai_agents/sable_openai_agents_design_partner.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: sable-openai-agents-design-partner-receipt
          path: artifacts/sable-openai-agents-design-partner-receipt.json
          if-no-files-found: error
