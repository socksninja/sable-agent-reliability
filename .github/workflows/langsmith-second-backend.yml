name: SABLE LangSmith Second Backend Reality Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'integrations/langsmith/**'
      - '.github/workflows/langsmith-second-backend.yml'
  pull_request:
    paths:
      - 'integrations/langsmith/**'
      - '.github/workflows/langsmith-second-backend.yml'

permissions:
  contents: read
  issues: write

jobs:
  langsmith-second-backend:
    runs-on: ubuntu-latest
    env:
      LANGSMITH_TRACING: true
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      SABLE_EXTERNAL_ISSUE: '63'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime and LangSmith
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'langgraph==1.2.11' 'langsmith>=0.3.45,<1'
      - name: Run fail-closed second-backend execution
        run: python integrations/langsmith/run_second_backend.py
      - name: Upload LangSmith evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sable-langsmith-second-backend-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

# Retrigger live verification after granting the least-privilege issues:write token.
