name: CrewAI negative permission evidence

on:
  push:
    paths:
      - 'integrations/crewai/run_negative_trace_v09.py'
      - 'integrations/crewai/task_negative.json'
      - 'permission_v01.py'
      - 'trace_submit_v09.py'
      - 'evaluator.py'
      - 'evidence_v06.py'
      - 'sandbox.py'
      - '.github/workflows/third-party-crewai-negative.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  negative-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install third-party runtime
        run: python -m pip install --upgrade pip 'crewai==1.15.20'
      - name: Capture live CrewAI negative trace
        run: python integrations/crewai/run_negative_trace_v09.py
      - name: Validate and normalize SABLE submission
        run: |
          python trace_submit_v09.py \
            --input results/third_party_crewai_negative_submission_v09.jsonl \
            --output results/third_party_crewai_negative_sable_v05.jsonl
      - name: Evaluate environment outcome
        run: |
          python evaluator.py \
            --tasks integrations/crewai/task_negative.json \
            --traces results/third_party_crewai_negative_sable_v05.jsonl \
            --out results/third_party_crewai_negative_evaluation.json
      - name: Generate evidence
        run: |
          python evidence_v06.py \
            --tasks integrations/crewai/task_negative.json \
            --results results/third_party_crewai_negative_sable_v05.jsonl \
            --out results/third_party_crewai_negative_evidence.json
      - name: Decide permission
        run: |
          python permission_v01.py \
            --input results/third_party_crewai_negative_sable_v05.jsonl \
            --output results/third_party_crewai_negative_permission.json
      - name: Enforce expected DENY
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          normalized = json.loads(Path('results/third_party_crewai_negative_sable_v05.jsonl').read_text())
          evaluation = json.loads(Path('results/third_party_crewai_negative_evaluation.json').read_text())
          evidence = json.loads(Path('results/third_party_crewai_negative_evidence.json').read_text())
          permission = json.loads(Path('results/third_party_crewai_negative_permission.json').read_text())
          assert normalized['steps'][0]['observed_result']['ok'] is False
          assert evaluation['summary']['task_success_rate'] == 0.0
          assert evidence['replay']['task_success'] is False
          assert evidence['replay']['replay_match'] is True
          assert permission['verified'] is False and permission['decision'] == 'DENY'
          print(json.dumps({
              'trace': 'CAPTURED',
              'verification': 'FAIL_AS_EXPECTED',
              'replay': 'MATCH',
              'permission': 'DENY',
              'reason_count': len(permission['reasons']),
          }, indent=2))
          PY
      - name: Upload negative evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: sable-crewai-negative-evidence
          path: results/
          if-no-files-found: error
      - name: Publish negative evidence bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/
          if git diff --cached --quiet; then
            echo 'No new evidence files to publish.'
            exit 0
          fi
          git commit -m 'evidence: CrewAI negative execution denial'
          git push
