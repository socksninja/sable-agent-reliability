name: SABLE v1.4 deterministic self-test

on:
  push:
    paths:
      - 'failure_taxonomy_v14.py'
      - 'tests/test_failure_taxonomy_v14.py'
      - '.github/workflows/v14-selftest.yml'
  pull_request:
    paths:
      - 'failure_taxonomy_v14.py'
      - 'tests/test_failure_taxonomy_v14.py'
      - '.github/workflows/v14-selftest.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run taxonomy self-test
        run: python -m unittest tests/test_failure_taxonomy_v14.py
