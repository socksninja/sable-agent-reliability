name: Third-party OpenAI Agents SDK verified execution

on:
  push:
    paths:
      - 'integrations/openai_agents/**'
      - 'permission_v01.py'
      - 'trace_submit_v09.py'
      - 'evaluator.py'
      - 'evidence_v06.py'
      - 'sandbox.py'
      - '.github/workflows/third-party-openai-agents.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verified-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install third-party runtime
        run: python -m pip install --upgrade pip 'openai-agents==0.22.0'
      - name: Capture live OpenAI Agents SDK runtime trace
        run: python integrations/openai_agents/run_real_trace_v11.py
      - name: Validate and normalize SABLE submission
        run: |
          python trace_submit_v09.py \
            --input results/third_party_openai_agents_submission_v09.jsonl \
            --output results/third_party_openai_agents_sable_v05.jsonl
      - name: Evaluate environment outcome
        run: |
          python evaluator.py \
            --tasks integrations/openai_agents/task.json \
            --traces results/third_party_openai_agents_sable_v05.jsonl \
            --out results/third_party_openai_agents_evaluation.json
      - name: Generate verified evidence
        run: |
          python evidence_v06.py \
            --tasks integrations/openai_agents/task.json \
            --results results/third_party_openai_agents_sable_v05.jsonl \
            --out results/third_party_openai_agents_evidence.json
      - name: Decide execution permission
        run: |
          python permission_v01.py \
            --input results/third_party_openai_agents_sable_v05.jsonl \
            --output results/third_party_openai_agents_permission.json
      - name: Enforce full Trace -> Verification -> Permission gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          submission = json.loads(Path('results/third_party_openai_agents_submission_v09.jsonl').read_text())
          normalized = json.loads(Path('results/third_party_openai_agents_sable_v05.jsonl').read_text())
          evaluation = json.loads(Path('results/third_party_openai_agents_evaluation.json').read_text())
          evidence = json.loads(Path('results/third_party_openai_agents_evidence.json').read_text())
          permission = json.loads(Path('results/third_party_openai_agents_permission.json').read_text())
          assert normalized['submission']['source_trace_hash'] == submission['integrity']['source_trace_hash']
          assert evaluation['summary']['task_success_rate'] == 1.0
          assert evidence['replay']['replay_match'] is True
          assert permission['verified'] is True and permission['decision'] == 'ALLOW'
          print(json.dumps({
              'runtime': submission['source']['framework'],
              'framework_version': submission['source']['framework_version'],
              'trace': 'CAPTURED',
              'verification': 'PASS',
              'evidence': 'GENERATED',
              'replay': 'MATCH',
              'permission': 'ALLOW',
              'source_trace_hash': submission['integrity']['source_trace_hash'],
              'runtime_trace_id': submission['provenance']['runtime_trace_id'],
          }, indent=2))
          PY
      - name: Upload auditable evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: sable-openai-agents-verified-execution
          path: results/
          if-no-files-found: error
      - name: Publish evidence bundle to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/
          if git diff --cached --quiet; then
            echo 'No new evidence files to publish.'
            exit 0
          fi
          git commit -m 'evidence: first live OpenAI Agents SDK verified execution'
          git push
