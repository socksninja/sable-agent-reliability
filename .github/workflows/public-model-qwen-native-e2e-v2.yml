name: SABLE Public Model Qwen Native Tool E2E v2

on:
  push:
    paths:
      - 'integrations/external_model/qwen_native_serve_runner.py'
      - 'integrations/external_model/task.json'
      - 'sandbox.py'
      - 'trace_submit_v09.py'
      - 'evaluator.py'
      - 'evidence_v06.py'
      - 'permission_v01.py'
      - 'verification_receipt_v24.py'
      - 'verification_receipt_v26.py'
      - '.github/workflows/public-model-qwen-native-e2e-v2.yml'
  workflow_dispatch:

env:
  MODEL: Qwen/Qwen2.5-0.5B-Instruct

jobs:
  public-model-native-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native model server runtime
        run: |
          python -m pip install --upgrade pip
          pip install 'torch>=2.3' 'transformers[serving]>=5.6' 'safetensors>=0.4' 'huggingface_hub>=0.27' 'cryptography>=43.0'
      - name: Start Hugging Face Transformers Serve
        run: |
          nohup transformers serve "$MODEL" --port 8000 --model-timeout -1 > results_public_model_qwen_native_server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/v1/models >/dev/null 2>&1; then
              echo "TRANSFORMERS_SERVE_READY"
              break
            fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "TRANSFORMERS_SERVE_EXITED"
              cat results_public_model_qwen_native_server.log || true
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/v1/models
          echo
          echo "WARMING_MODEL"
          curl -N -fsS -X POST http://127.0.0.1:8000/load_model \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"$MODEL\"}" \
            | tee load_model.sse
          grep -q '"status": "ready"' load_model.sse
      - name: Run Qwen through structured tool calling into SABLE Sandbox
        run: python integrations/external_model/qwen_native_serve_runner.py --model "$MODEL" --out results/public_model_qwen_native_trace.json
      - name: Prepare submission for trace_submit
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          raw=json.loads(Path('results/public_model_qwen_native_trace.json').read_text(encoding='utf-8'))
          trace={k:raw[k] for k in ['task_id','goal','agent','steps','claimed_status','final_report','environment','integrity']}
          trace['schema_version']='sable.submission.v0.9'
          submission={
            'protocol_version':'sable.submission.v0.9',
            'submission_id':'public-model-qwen-native-e2e-v2',
            'source':{'agent_name':raw['agent']['name'],'agent_version':'1.0.0','framework':raw['agent']['framework'],'framework_version':raw['agent']['framework_version'],'adapter':'qwen_native_serve_runner.py','evidence_class':'public_pretrained_model_execution'},
            'trace':trace,
            'provenance':{'captured_at':'github-actions','collector':'SABLE public Qwen native tool E2E v2','runtime_trace_id':'public-model-qwen-native-e2e-v2','capture_method':'qwen_native_serve_runner.py','redaction_policy':'synthetic task data only'},
            'integrity':{'source_trace_hash':hashlib.sha256(json.dumps(trace,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest(),'hash_algorithm':'sha256','canonicalization':'json-sort-keys-utf8'}
          }
          Path('results/public_model_qwen_native_submission.jsonl').write_text(json.dumps(submission,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - name: Ingest, evaluate and authorize
        run: |
          python trace_submit_v09.py --input results/public_model_qwen_native_submission.jsonl --output results/public_model_qwen_native_sable_v05.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          task=json.loads(Path('integrations/external_model/task.json').read_text(encoding='utf-8'))
          normalized=task if isinstance(task,list) else [task]
          Path('results/public_model_qwen_native_tasks.json').write_text(json.dumps(normalized,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python evaluator.py --tasks results/public_model_qwen_native_tasks.json --traces results/public_model_qwen_native_sable_v05.jsonl --out results/public_model_qwen_native_evaluation.json
          python evidence_v06.py --tasks results/public_model_qwen_native_tasks.json --results results/public_model_qwen_native_sable_v05.jsonl --out results/public_model_qwen_native_evidence.jsonl
          python permission_v01.py --input results/public_model_qwen_native_sable_v05.jsonl --output results/public_model_qwen_native_permission.jsonl
      - name: Assert verified native execution and build signed receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from verification_receipt_v24 import build_receipt
          from verification_receipt_v26 import sign_receipt, verify_self_contained
          ev=json.loads(Path('results/public_model_qwen_native_evidence.jsonl').read_text().splitlines()[0])
          pm=json.loads(Path('results/public_model_qwen_native_permission.jsonl').read_text().splitlines()[0])
          assert ev['outcome']['task_success'] is True, ev
          assert ev['replay']['replay_match'] is True, ev
          assert ev['execution']['tool_calls'] >= 1, ev
          assert pm['decision']=='ALLOW' and pm['verified'] is True, pm
          signed=sign_receipt(build_receipt(ev, pm), Ed25519PrivateKey.generate(), key_id='sable-public-qwen-native-e2e-v2')
          ok,reasons=verify_self_contained(signed)
          assert ok,reasons
          Path('results/public_model_qwen_native_signed_receipt_v26.json').write_text(json.dumps(signed,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('PUBLIC_MODEL_NATIVE_SIGNED_RECEIPT_PASS', signed['receipt_hash'])
          PY
      - name: Verify public verifier endpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          data=Path('results/public_model_qwen_native_signed_receipt_v26.json').read_bytes()
          req=Request('https://sable-verified-execution.vercel.app/v1/verify',data=data,headers={'Content-Type':'application/json'},method='POST')
          with urlopen(req, timeout=30) as r:
            result=json.loads(r.read())
          assert result['verified'] is True, result
          assert result['verification_level']=='CRYPTOGRAPHICALLY_VERIFIED', result
          assert result['execution_proof'] is True, result
          print(json.dumps(result,indent=2))
          PY
      - name: Upload native public model bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sable-public-model-qwen-native-e2e-v2
          path: |
            results/public_model_qwen_native_*
            results_public_model_qwen_native_server.log
            load_model.sse
          if-no-files-found: warn
