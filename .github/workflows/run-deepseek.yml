name: Run SABLE Evaluation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Model provider'
        required: true
        default: openrouter
        type: choice
        options:
          - openrouter
          - deepseek

jobs:
  run-sable:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run with OpenRouter free models
        if: inputs.provider == 'openrouter'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$OPENROUTER_API_KEY" || (echo 'Missing repository secret: OPENROUTER_API_KEY' && exit 1)
          export SABLE_API_KEY="$OPENROUTER_API_KEY"
          export SABLE_BASE_URL="https://openrouter.ai/api/v1"
          export SABLE_MODEL="openrouter/free"
          python3 real_agent_runner.py \
            --tasks tasks/tasks.json \
            --out results/openrouter_free_sable_v0.3.jsonl \
            --thinking disabled

      - name: Run with DeepSeek
        if: inputs.provider == 'deepseek'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          test -n "$DEEPSEEK_API_KEY" || (echo 'Missing repository secret: DEEPSEEK_API_KEY' && exit 1)
          chmod +x ./run_deepseek.sh
          ./run_deepseek.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sable-results-${{ inputs.provider }}
          path: results/
          if-no-files-found: warn
