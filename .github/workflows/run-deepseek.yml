name: Run SABLE Evaluation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      provider:
        description: Provider
        required: true
        default: openrouter
        type: choice
        options:
          - openrouter
          - huggingface
          - deepseek
      suite:
        description: Benchmark suite
        required: true
        default: smoke_then_full
        type: choice
        options:
          - smoke_only
          - smoke_then_full

jobs:
  selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate SABLE v0.4 benchmark
        run: python3 tasks/generate_adversarial.py
      - name: Run model-independent v0.5 self-test
        run: python3 selftest_v05.py
      - name: Run v0.6 evidence-layer self-test
        run: python3 selftest_v06.py
      - name: Validate reliability scorer
        run: |
          python3 - <<'PY'
          import json
          from reliability_score import build_report
          row = {
              "task_id": "SELF-SCORE",
              "family": "selftest",
              "environment": {"task_success": True, "final_state_hash": "x"},
              "integrity": {"termination": "final"},
              "steps": [],
              "claimed_status": "success",
          }
          report = build_report([row])
          assert report["reliability_score"] == 100.0, report
          assert report["pass_rate"] == 1.0, report
          print(json.dumps(report, indent=2))
          PY
      - name: Upload self-test
        uses: actions/upload-artifact@v7
        with:
          name: sable-v06-selftest-${{ github.run_id }}
          path: results/

  real-model:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: selftest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate SABLE v0.4 benchmark
        run: python3 tasks/generate_adversarial.py
      - name: Resolve provider configuration
        env:
          INPUT_PROVIDER: ${{ inputs.provider }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          PROVIDER="${INPUT_PROVIDER:-openrouter}"
          case "$PROVIDER" in
            huggingface)
              echo "SABLE_API_KEY=$HF_TOKEN" >> "$GITHUB_ENV"
              echo "SABLE_BASE_URL=https://router.huggingface.co/v1" >> "$GITHUB_ENV"
              echo "SABLE_MODEL=Qwen/Qwen3.8-27B:ovhcloud" >> "$GITHUB_ENV"
              ;;
            openrouter)
              echo "SABLE_API_KEY=$OPENROUTER_API_KEY" >> "$GITHUB_ENV"
              echo "SABLE_BASE_URL=https://openrouter.ai/api/v1" >> "$GITHUB_ENV"
              echo "SABLE_MODEL=nvidia/nemotron-3-ultra-550b-a55b:free" >> "$GITHUB_ENV"
              ;;
            deepseek)
              echo "SABLE_API_KEY=$DEEPSEEK_API_KEY" >> "$GITHUB_ENV"
              echo "SABLE_BASE_URL=https://api.deepseek.com" >> "$GITHUB_ENV"
              echo "SABLE_MODEL=deepseek-v4-flash" >> "$GITHUB_ENV"
              ;;
            *) echo "Unsupported provider: $PROVIDER"; exit 1 ;;
          esac
          echo "SABLE_PROVIDER=$PROVIDER" >> "$GITHUB_ENV"
      - name: Run 10-task smoke test
        if: ${{ inputs.suite == 'smoke_only' || inputs.suite == 'smoke_then_full' }}
        env:
          SABLE_TASKS: tasks/tasks_smoke_10.json
          SABLE_OUT: results/smoke_${{ github.run_id }}.jsonl
        run: |
          chmod +x ./run_sable.sh
          ./run_sable.sh
      - name: Evaluate smoke stability gate
        env:
          SMOKE_RESULTS: results/smoke_${{ github.run_id }}.jsonl
        run: python3 smoke_gate.py --results "$SMOKE_RESULTS" --expected 10 --max-model-errors 1
      - name: Evaluate smoke trace
        env:
          RESULTS: results/smoke_${{ github.run_id }}.jsonl
        run: python3 sable_v05.py --tasks tasks/tasks_smoke_10.json --results "$RESULTS" --report results/smoke_v05_report.json --replay
      - name: Score smoke reliability
        env:
          RESULTS: results/smoke_${{ github.run_id }}.jsonl
        run: python3 reliability_score.py --results "$RESULTS" --out results/smoke_reliability_report.json
      - name: Generate smoke evidence packs
        env:
          RESULTS: results/smoke_${{ github.run_id }}.jsonl
        run: python3 evidence_v06.py --tasks tasks/tasks_smoke_10.json --results "$RESULTS" --out results/smoke_evidence_v06.jsonl
      - name: Run full 140-task benchmark
        if: ${{ inputs.suite == 'smoke_then_full' }}
        env:
          SABLE_TASKS: tasks/tasks_v0_4_140.json
          SABLE_OUT: results/full_${{ github.run_id }}.jsonl
        run: ./run_sable.sh
      - name: Evaluate full trace
        if: ${{ inputs.suite == 'smoke_then_full' }}
        env:
          RESULTS: results/full_${{ github.run_id }}.jsonl
        run: python3 sable_v05.py --tasks tasks/tasks_v0_4_140.json --results "$RESULTS" --report results/full_v05_report.json --replay
      - name: Score full reliability
        if: ${{ inputs.suite == 'smoke_then_full' }}
        env:
          RESULTS: results/full_${{ github.run_id }}.jsonl
        run: python3 reliability_score.py --results "$RESULTS" --out results/full_reliability_report.json
      - name: Generate full evidence packs
        if: ${{ inputs.suite == 'smoke_then_full' }}
        env:
          RESULTS: results/full_${{ github.run_id }}.jsonl
        run: python3 evidence_v06.py --tasks tasks/tasks_v0_4_140.json --results "$RESULTS" --out results/full_evidence_v06.jsonl
      - name: Upload real-model results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sable-v06-results-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
