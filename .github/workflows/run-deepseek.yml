name: Run SABLE Evaluation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      provider:
        description: Provider
        required: true
        default: openrouter
        type: choice
        options:
          - openrouter
          - deepseek

jobs:
  run-sable:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate SABLE v0.4 benchmark
        run: python3 tasks/generate_adversarial.py

      - name: Run OpenRouter SABLE
        if: ${{ github.event_name == 'push' || inputs.provider == 'openrouter' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          chmod +x ./run_openrouter.sh
          ./run_openrouter.sh

      - name: Run DeepSeek SABLE
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.provider == 'deepseek' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          chmod +x ./run_deepseek.sh
          ./run_deepseek.sh --tasks tasks/tasks_v0_4_140.json --out results/deepseek_sable_v0.4.jsonl

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sable-results-v0.4
          path: results/
          if-no-files-found: warn
