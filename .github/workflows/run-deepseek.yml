name: Run DeepSeek SABLE

on:
  workflow_dispatch:

jobs:
  run-deepseek:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DeepSeek evaluation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          chmod +x ./run_deepseek.sh
          ./run_deepseek.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-sable-results
          path: results/
          if-no-files-found: warn
