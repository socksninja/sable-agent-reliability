name: SABLE External Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'run_one_sable_task.py'
      - '.github/workflows/sable-external.yml'

jobs:
  sable:
    uses: socksninja/sable-agent-reliability/.github/workflows/external-verification-reusable.yml@74c2328d5e0ac09f12bf0f6ac978cb531390e097
    with:
      agent_command: python examples/external-submission-starter/run_one_sable_task.py
